services:
  # Database Service (MariaDB 10.11)
  db:
    image: mariadb:10.11
    container_name: sepriet_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_secret_password}
      MYSQL_DATABASE: ${DB_DATABASE:-sepriet_prod}
      MYSQL_USER: ${DB_USERNAME:-sepriet_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-sepriet_password}
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - sepriet_network
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend Service (PHP 8.3-FPM + Laravel 11)
  backend:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    container_name: sepriet_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env.production
    volumes:
      - storage_data:/var/www/html/storage
      - ./.env.production:/var/www/html/.env
    networks:
      - sepriet_network

  # Web Server (Nginx Reverse Proxy + Static Frontend)
  web:
    image: nginx:alpine
    container_name: sepriet_web
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./frontend/dist:/var/www/frontend:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - storage_data:/var/www/html/storage:ro
    depends_on:
      - backend
    networks:
      - sepriet_network

volumes:
  db_data:
    driver: local
  storage_data:
    driver: local

networks:
  sepriet_network:
    driver: bridge
